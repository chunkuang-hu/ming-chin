<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>明朝地圖 · 兩京十三布政使司</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400&display=swap');
:root {
  --ink: #1a1a2e;
  --paper: #f4ede0;
  --paper2: #ece3d2;
  --ocean: #b8d4e8;
  --land: #cfc09a;
  --land-hover: #b8a87e;
  --border: #7a6a4a;
  --coast: #1a5276;
  --grid: rgba(40,70,120,0.22);
  --grid-label: #2c4a7a;
  --gold: #9a6820;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1c2030;display:flex;align-items:center;justify-content:center;height:100dvh;font-family:"Noto Sans SC",sans-serif;padding:12px;touch-action:pan-x pan-y;overflow:hidden}
.card{background:var(--paper);border-radius:3px;box-shadow:0 24px 64px rgba(0,0,0,0.55),0 0 0 1px var(--border);max-width:940px;width:100%;overflow:hidden;touch-action:pan-x pan-y;display:flex;flex-direction:column;height:100%}
.header{background:var(--ink);padding:10px 18px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--gold);flex-shrink:0}
.header h1{font-family:"Noto Serif SC",serif;font-size:1.1rem;letter-spacing:.06em;color:#f0e0c0}
.header .sub{font-size:.62rem;color:#7090b0;letter-spacing:.12em;text-transform:uppercase}
.map-wrap{position:relative;background:var(--ocean);background-image:radial-gradient(ellipse at 75% 85%,#a8c8e0 0%,transparent 55%),radial-gradient(ellipse at 15% 25%,#d0e4f0 0%,transparent 45%);touch-action:none;flex:1;min-height:0;overflow:hidden}
#map-svg{display:block;width:100%;height:100%;touch-action:none}
.province{fill:var(--land);stroke:var(--border);stroke-width:.55;transition:fill .18s;cursor:pointer}
.province:hover{fill:var(--land-hover)}
.grid-lon,.grid-lat{stroke:var(--grid);stroke-width:.7;stroke-dasharray:5 4;fill:none}
.grid-label{fill:var(--grid-label);font-size:9.5px;font-family:"Noto Sans SC",sans-serif;font-weight:300;letter-spacing:.03em}
.coast-line{fill:none;stroke:var(--coast);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(26,82,118,.55))}
.coast-dots{fill:none;stroke:#3d8fb5;stroke-width:1;stroke-dasharray:2 6;opacity:.7}
#tip{position:absolute;background:rgba(26,26,46,.92);color:#f0e0c0;padding:5px 11px;border-radius:2px;font-size:.76rem;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;border-left:3px solid var(--gold);z-index:99;backdrop-filter:blur(4px)}
.legend{background:var(--ink);border-top:1px solid rgba(154,104,32,.3);padding:0 14px;display:flex;gap:8px;align-items:center;flex-shrink:0;height:36px;overflow:hidden;white-space:nowrap}
.li{display:flex;align-items:center;gap:7px;font-size:.72rem;color:#4a3a20}
.sw{width:28px;height:10px;border-radius:1px}
.sw-land{background:var(--land);border:1px solid var(--border)}
.sw-sea{background:var(--ocean);border:1px solid #88a8c0}
.sw-coast{background:none;border-top:2.5px solid var(--coast);height:2px;margin-top:4px}
.sw-grid{background:none;border-top:1.5px dashed var(--grid-label);height:2px;margin-top:4px}
.mcity{cursor:pointer;transition:opacity .15s,filter .15s;pointer-events:all;-webkit-tap-highlight-color:transparent}
.mcity:hover{opacity:.8;filter:drop-shadow(0 0 4px rgba(255,255,220,.9))}
.mcity.active{filter:drop-shadow(0 0 6px rgba(255,220,80,1));opacity:1}

/* ── Official panel（地圖下方）── */
#official-panel{
  display:block;background:var(--ink);border-top:2px solid var(--gold);
  position:relative;height:160px;overflow:hidden;flex-shrink:0;
}
#op-placeholder{
  display:flex;align-items:center;justify-content:center;height:100%;
  color:rgba(144,160,180,.3);font-size:.78rem;letter-spacing:.22em;
  font-family:"Noto Serif SC",serif;pointer-events:none;
}
#op-list{
  display:none;height:calc(100% - 18px);
  flex-direction:row;gap:0;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#op-list::-webkit-scrollbar{display:none}
#official-panel.visible #op-placeholder{display:none}
#official-panel.visible #op-list{display:flex}
#official-panel.visible #op-close{display:block}
.op-card{
  flex:0 0 175px;scroll-snap-align:start;
  padding:10px 12px 8px;border-right:1px solid rgba(154,104,32,.2);
  display:flex;flex-direction:column;gap:4px;
}
.op-card:last-child{border-right:none}
.op-card-top{display:flex;align-items:flex-start;gap:6px}
.op-card-icon{font-size:1.1rem;flex-shrink:0;line-height:1.2}
.op-card-name{font-family:"Noto Serif SC",serif;font-size:.72rem;color:#f0e0c0;line-height:1.35}
.op-card-bio{font-size:.6rem;color:#7090b0;line-height:1.55;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.op-stat{display:flex;align-items:center;gap:4px;font-size:.6rem;margin-top:1px}
.op-stat-label{color:#9ab8d8;width:20px;flex-shrink:0}
.op-stat-bar{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.op-stat-fill{height:100%;border-radius:2px}
.fill-int{background:linear-gradient(90deg,#3a86ff,#74b3ff)}
.fill-str{background:linear-gradient(90deg,#e63946,#ff6b6b)}
.op-stat-val{color:#f0d898;width:20px;text-align:right;flex-shrink:0}
#op-dots{
  position:absolute;bottom:4px;left:0;right:0;
  display:flex;justify-content:center;gap:4px;pointer-events:none;height:10px;align-items:center;
}
.op-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .2s}
.op-dot.active{background:rgba(154,104,32,.9)}
#op-close{
  position:absolute;top:6px;right:10px;
  background:none;border:none;color:#7090b0;
  font-size:.9rem;cursor:pointer;line-height:1;padding:4px 6px;border-radius:2px;
  transition:color .15s;z-index:10;
}
#op-close:hover{color:#f0d898}
.coords{margin-left:auto;font-family:monospace;font-size:.7rem;color:var(--grid-label);background:rgba(255,255,255,.45);padding:3px 8px;border-radius:2px;border:1px solid #c0b090;min-width:188px;text-align:right}
</style>

<script>
const mw = document.getElementById('mw');
const tip = document.getElementById('tip');
const cd = document.getElementById('cd');
const panel = document.getElementById('official-panel');
const LON_MIN=73.554302, LON_MAX=134.775703;
const LAT_MAX=53.561780, LAT_MIN=18.155060;
const SVG_W=774.04419, SVG_H=447.65989;
let activeCity = null;

const FACTION_COLORS = {
  '明朝': '#3a86ff',
  '清朝': '#e63946',
  '大順': '#f4a261',
  '大西': '#2ec4b6',
};
function factionColor(label) {
  const faction = (label || '').split('｜')[2] || '';
  for (const [key, color] of Object.entries(FACTION_COLORS)) {
    if (faction.includes(key)) return color;
  }
  return '#888';
}

function toGeo(px,py){
  return {
    lon: (LON_MIN + (px/SVG_W)*(LON_MAX-LON_MIN)).toFixed(1),
    lat: (LAT_MAX - (py/SVG_H)*(LAT_MAX-LAT_MIN)).toFixed(1)
  };
}

// ── Official panel ──────────────────────────────────────
const opList = document.getElementById('op-list');
const opDots = document.getElementById('op-dots');

function makeStatBar(label, value, fillClass) {
  return `<div class="op-stat">
    <span class="op-stat-label">${label}</span>
    <div class="op-stat-bar"><div class="op-stat-fill ${fillClass}" style="width:${value}%"></div></div>
    <span class="op-stat-val">${value}</span>
  </div>`;
}

function showPanel(el) {
  const d = el.dataset;
  if (!d.officialName) return;

  if (activeCity && activeCity !== el) activeCity.classList.remove('active');
  activeCity = el;
  el.classList.add('active');

  // Parse people data [role, name, bio, icon, int, str]
  let people = [];
  try {
    const raw = el.getAttribute('data-people');
    if (raw) people = JSON.parse(raw.replace(/&quot;/g, '"'));
  } catch(e) {}
  if (!people.length) {
    people = [[d.officialRole||'文官', d.officialName, d.officialBio, d.officialIcon||'📜', 50, 50]];
  }

  opList.innerHTML = '';
  people.forEach(([role, name, bio, icon, intVal, strVal]) => {
    const card = document.createElement('div');
    card.className = 'op-card';
    card.innerHTML = `
      <div class="op-card-top">
        <span class="op-card-icon">${icon}</span>
        <span class="op-card-name">${name}</span>
      </div>
      <div class="op-card-bio">${bio}</div>
      ${makeStatBar('智', intVal, 'fill-int')}
      ${makeStatBar('武', strVal, 'fill-str')}
    `;
    opList.appendChild(card);
  });

  // Dots
  opDots.innerHTML = '';
  if (people.length > 1) {
    people.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'op-dot' + (i === 0 ? ' active' : '');
      opDots.appendChild(dot);
    });
    // Update dots on scroll
    opList.onscroll = () => {
      const idx = Math.round(opList.scrollLeft / 175);
      opDots.querySelectorAll('.op-dot').forEach((d,i) => d.classList.toggle('active', i===idx));
    };
  }

  panel.classList.add('visible');
  document.getElementById('op-close').style.display = 'block';
  opList.scrollLeft = 0;

  // 更新城市資訊條
  const labelParts2 = (d.label||'').split('｜');
  const ciName = labelParts2[0] || '';
  const ciProv = labelParts2[1] || '';
  const ciFact = labelParts2[2] || '';
  document.getElementById('ci-name').textContent = ciName;
  document.getElementById('ci-province').textContent = ciProv;
  document.getElementById('ci-faction').textContent = ciFact;
  document.getElementById('ci-dot').style.background = factionColor(d.label);
}

function closePanel() {
  panel.classList.remove('visible');
  document.getElementById('op-close').style.display = 'none';
  if (activeCity) { activeCity.classList.remove('active'); activeCity = null; }
}

document.getElementById('op-close').addEventListener('click', closePanel);
document.getElementById('op-close').addEventListener('touchend', function(e){ e.preventDefault(); closePanel(); });

// ── 預先建立城市座標表（SVG 座標），用於 touch 命中測試 ──
const cities = Array.from(document.querySelectorAll('.mcity')).map(c => ({
  el: c,
  cx: parseFloat(c.getAttribute('cx')),
  cy: parseFloat(c.getAttribute('cy')),
  r:  parseFloat(c.getAttribute('r')) || 5.5
}));

// ── 動態顏色：依 data-label 第三段勢力決定圓點顏色 ──
document.querySelectorAll('.mcity').forEach(c => {
  const label = c.dataset.label || '';
  c.setAttribute('fill', factionColor(label));
});

// 把螢幕座標轉成 SVG viewBox 座標（考慮 preserveAspectRatio letterbox）
function getLetterbox() {
  const svgEl = document.getElementById('map-svg');
  const r = svgEl.getBoundingClientRect();
  // SVG viewBox 比例
  const vbAR = vw / vh;
  const elAR = r.width / r.height;
  let drawW, drawH, offX, offY;
  if (elAR > vbAR) {
    // 左右有留白
    drawH = r.height;
    drawW = drawH * vbAR;
    offX  = (r.width - drawW) / 2;
    offY  = 0;
  } else {
    // 上下有留白
    drawW = r.width;
    drawH = drawW / vbAR;
    offX  = 0;
    offY  = (r.height - drawH) / 2;
  }
  return { left: r.left + offX, top: r.top + offY, width: drawW, height: drawH };
}

function screenToSVG(clientX, clientY) {
  const lb = getLetterbox();
  const px = (clientX - lb.left) / lb.width  * vw;
  const py = (clientY - lb.top)  / lb.height * vh;
  return { x: vx + px, y: vy + py };
}

function clientToSVG(clientX, clientY) {
  return screenToSVG(clientX, clientY);
}

// 找最近城市（只要在圓點半徑內）
function findNearestCity(svgX, svgY) {
  let best = null, bestD = Infinity;
  for (const c of cities) {
    const dx = svgX - c.cx, dy = svgY - c.cy;
    const d  = Math.sqrt(dx*dx + dy*dy);
    if (d < c.r + 6 && d < bestD) { best = c; bestD = d; }
  }
  return best;
}

function handleMapTap(clientX, clientY, target) {
  if (target && target.closest && target.closest('#official-panel')) return;
  const sp = screenToSVG(clientX, clientY);
  const hit = findNearestCity(sp.x, sp.y);
  tip.style.opacity = '0';
  if (hit) { showPanel(hit.el); } else { closePanel(); }
}

mw.addEventListener('click', e => {
  handleMapTap(e.clientX, e.clientY, e.target);
});

// ── Pinch-zoom & pan（操作 viewBox，不用 CSS transform）──
const SVG_ORIG_X = 0, SVG_ORIG_Y = 0;
let vx = 0, vy = 0, vw = SVG_W, vh = SVG_H; // 目前 viewBox
let pinching = false;
let lastPinchDist = 0;
let panStart = null;
let touchMoved = false;

const svgEl = document.getElementById('map-svg');

function setViewBox() {
  // 限制不能超出原始範圍
  vw = Math.min(Math.max(vw, SVG_W / 6), SVG_W);
  vh = Math.min(Math.max(vh, SVG_H / 6), SVG_H);
  vx = Math.min(Math.max(vx, 0), SVG_W - vw);
  vy = Math.min(Math.max(vy, 0), SVG_H - vh);
  svgEl.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
}

function pinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

// 把螢幕座標轉成 SVG 座標（給 pinch 用）
function clientToSVG(clientX, clientY) {
  const r = svgEl.getBoundingClientRect();
  return {
    x: vx + (clientX - r.left) / r.width  * vw,
    y: vy + (clientY - r.top)  / r.height * vh
  };
}

mw.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    pinching = true;
    touchMoved = true;
    lastPinchDist = pinchDist(e.touches);
  } else if (e.touches.length === 1) {
    pinching = false;
    touchMoved = false;
    panStart = clientToSVG(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

mw.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    touchMoved = true;
    const dist = pinchDist(e.touches);
    const ratio = lastPinchDist / dist; // <1 放大, >1 縮小
    // pinch 中心點在 SVG 座標
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const mid = clientToSVG(mx, my);
    // 以中心點縮放 viewBox
    vx = mid.x - (mid.x - vx) * ratio;
    vy = mid.y - (mid.y - vy) * ratio;
    vw *= ratio;
    vh *= ratio;
    lastPinchDist = dist;
    setViewBox();
  } else if (e.touches.length === 1 && !pinching) {
    touchMoved = true;
    const cur = clientToSVG(e.touches[0].clientX, e.touches[0].clientY);
    // panStart 是按下時的 SVG 座標，平移讓那個點跟著手指
    vx -= cur.x - panStart.x;
    vy -= cur.y - panStart.y;
    setViewBox();
    // 更新 panStart（因為 viewBox 已變）
    panStart = clientToSVG(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

mw.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinching = false;
  if (touchMoved) return;
  e.preventDefault();
  const t = e.changedTouches[0];
  handleMapTap(t.clientX, t.clientY, e.target);
});

// 雙擊重置
mw.addEventListener('dblclick', () => {
  vx = 0; vy = 0; vw = SVG_W; vh = SVG_H;
  setViewBox();
});

// ── City markers hover（桌面） ────────────────────────────
mw.addEventListener('mousemove', e => {
  const r = mw.getBoundingClientRect();
  const {lon,lat} = toGeo((e.clientX-r.left)*(SVG_W/r.width),(e.clientY-r.top)*(SVG_H/r.height));
  cd.textContent = `${lat}°N, ${lon}°E`;
});
mw.addEventListener('mouseleave', () => { cd.textContent='游標位置：—'; });

document.querySelectorAll('.mcity').forEach(c => {
  c.addEventListener('mouseenter', function(){
    const n = this.dataset.label||'';
    if(n){ tip.textContent=n; tip.style.opacity='1'; }
  });
  c.addEventListener('mousemove', function(e){
    const r = mw.getBoundingClientRect();
    tip.style.left=(e.clientX-r.left+14)+'px';
    tip.style.top=(e.clientY-r.top-12)+'px';
  });
  c.addEventListener('mouseleave', () => { tip.style.opacity='0'; });
});

document.querySelectorAll('.province').forEach(p => {
  p.addEventListener('mouseenter', function(){
    const n = this.dataset.name||'';
    if(n){ tip.textContent=n; tip.style.opacity='1'; }
  });
  p.addEventListener('mousemove', function(e){
    const r = mw.getBoundingClientRect();
    tip.style.left=(e.clientX-r.left+14)+'px';
    tip.style.top=(e.clientY-r.top-12)+'px';
  });
  p.addEventListener('mouseleave', () => { tip.style.opacity='0'; });
});
